name: synk

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.1
  google_fonts: ^9.0.0
  image: ^4.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/synk_logo.png
    - assets/synk_logo_transparent.png
    - assets/synk_one_jumping.png
    - assets/avatar_female.png
    - assets/avatar_male.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/synk_logo.png"
  adaptive_icon_background: "#F6F1E6"
  adaptive_icon_foreground: "assets/synk_logo_transparent.png"
