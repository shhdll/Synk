# Sets the app version in pubspec.yaml after every push to main:
# 1.<merged pull requests>.0+<commits>, e.g. 1.70.0+240. The About page
# shows it as "Version 1.70.0 (240)".
name: Bump version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        run: |
          prs=$(git log --oneline | grep -c 'Merge pull request' || true)
          commits=$(git rev-list --count HEAD)
          sed -i "s/^version: .*/version: 1.${prs}.0+${commits}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      # Pushes made with the workflow's own token don't start it again.
      - name: Commit
        run: |
          git diff --quiet pubspec.yaml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "bump version"
          git push
