
[functions.places-proxy]
enabled = true
verify_jwt = false
import_map = "./functions/places-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/places-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/places-proxy/*.html" ]

[functions.notify-waitlist-promotion]
enabled = true
# The function validates a random webhook secret from Supabase Vault itself.
verify_jwt = false

[functions.submit-support]
enabled = true
# Checks the user token itself.
verify_jwt = false

[functions.delete-account]
enabled = true
# Checks the user token itself.
verify_jwt = false

[functions.reply-support]
enabled = true
# Checks the reply token or the admin token itself.
verify_jwt = false

[functions.request-admin]
enabled = true
# Checks the user token itself.
verify_jwt = false

[functions.telegram-webhook]
enabled = true
# Checks Telegram's secret token header itself.
verify_jwt = false

[functions.save-activity]
enabled = true
# Creates and edits activities after checking their content with OpenAI.
# Supabase checks the user token before the function runs, and the function
# checks it again with Supabase Auth to get the user id. Only switch this
# to false if Supabase rejects valid tokens (see ACTIVITY_MODERATION.md).
verify_jwt = true
import_map = "./functions/save-activity/deno.json"
entrypoint = "./functions/save-activity/index.ts"
