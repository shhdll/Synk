<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <meta name="supported-color-schemes" content="only light">
  <title>Email Changed</title>
  <style>
    :root {
      color-scheme: only light !important;
      supported-color-schemes: only light !important;
    }
    /* Prevent iOS / Apple Mail dark mode inversion */
    @media (prefers-color-scheme: dark) {
      body, table, td, p, a, h1, span {
        color-scheme: only light !important;
      }
      .keep-light-bg {
        background-color: #F6F1E6 !important;
      }
      .keep-white-card {
        background-color: #FFFFFF !important;
      }
      .keep-dark-text {
        color: #2D2A32 !important;
      }
      .keep-muted-text {
        color: #68646E !important;
      }
      .keep-subtext {
        color: #9E99A3 !important;
      }
    }
    /* Prevent Android / Samsung / Gmail auto dark-mode filter */
    [data-ogsc] .keep-light-bg { background-color: #F6F1E6 !important; }
    [data-ogsc] .keep-white-card { background-color: #FFFFFF !important; }
    [data-ogsc] .keep-dark-text { color: #2D2A32 !important; }
    [data-ogsc] .keep-muted-text { color: #68646E !important; }
    [data-ogsb] .keep-light-bg { background-color: #F6F1E6 !important; }
    [data-ogsb] .keep-white-card { background-color: #FFFFFF !important; }
  </style>
</head>
<body class="keep-light-bg" style="margin: 0; padding: 40px 16px; background-color: #F6F1E6; background-image: linear-gradient(#F6F1E6, #F6F1E6); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #2D2A32; -webkit-font-smoothing: antialiased;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td align="center">
        <!-- Main Card Container -->
        <table role="presentation" class="keep-white-card" width="100%" style="max-width: 480px; background-color: #FFFFFF; background-image: linear-gradient(#FFFFFF, #FFFFFF); border-radius: 28px; border: 1px solid rgba(45, 42, 50, 0.06); padding: 48px 36px; box-shadow: 0 12px 32px rgba(45, 42, 50, 0.05);" cellspacing="0" cellpadding="0" border="0">

          <!-- Logo & Brand Header -->
          <tr>
            <td align="center" style="padding-bottom: 28px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="vertical-align: middle; padding-right: 12px;">
                    <img src="https://mxmdfgmqejnmsotlctht.supabase.co/storage/v1/object/public/public-assets/synk_logo-removebg-preview.png" alt="Synk" width="46" height="46" style="display: block; width: 46px; height: 46px; border-radius: 12px; object-fit: contain;" />
                  </td>
                  <td style="vertical-align: middle;">
                    <span class="keep-dark-text" style="font-size: 26px; font-weight: 800; letter-spacing: -0.8px; color: #2D2A32;">Synk</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td align="center" style="padding-bottom: 12px;">
              <h1 class="keep-dark-text" style="margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -0.4px; color: #2D2A32; line-height: 1.25;">
                Your Email Was Changed
              </h1>
            </td>
          </tr>

          <!-- Message Body -->
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <p class="keep-muted-text" style="margin: 0; font-size: 15px; line-height: 1.6; color: #68646E; max-width: 360px;">
                You'll now sign in to Synk with your new email address.
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="border-top: 1px solid #F0ECE1; padding-bottom: 24px;"></td>
          </tr>

          <!-- Old and New Addresses -->
          <tr>
            <td align="center" style="padding-bottom: 16px;">
              <p class="keep-subtext" style="margin: 0 0 4px 0; font-size: 12px; color: #9A95A0; line-height: 1.4;">
                Previous email
              </p>
              <!-- Styled link so Gmail doesn't turn the address blue -->
              <a href="mailto:{{ .OldEmail }}" class="keep-muted-text" style="font-size: 14px; color: #68646E; text-decoration: none; word-break: break-all;">{{ .OldEmail }}</a>
            </td>
          </tr>
          <tr>
            <td align="center">
              <p class="keep-subtext" style="margin: 0 0 4px 0; font-size: 12px; color: #9A95A0; line-height: 1.4;">
                New email
              </p>
              <a href="mailto:{{ .Email }}" class="keep-dark-text" style="font-size: 14px; font-weight: 700; color: #2D2A32; text-decoration: none; word-break: break-all;">{{ .Email }}</a>
            </td>
          </tr>

        </table>

        <!-- Security Notice Footer -->
        <table role="presentation" width="100%" style="max-width: 480px; padding-top: 20px;" cellspacing="0" cellpadding="0" border="0">
          <tr>
            <td align="center">
              <p class="keep-subtext" style="margin: 0; font-size: 12px; color: #9E99A3; line-height: 1.5;">
                If you didn't make this change, contact Synk support right away.
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
