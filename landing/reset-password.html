<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset Password · Synk</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="logo-mark"><img src="logo.png" alt="Synk logo" /></div>
      <div class="wordmark">Synk</div>
      <section class="card">
        <div class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" /><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2" /></svg>
        </div>
        <h1 id="title">Reset your password</h1>
        <p id="message">Redirecting to reset your password...</p>
        <a id="open-app" class="button" href="io.supabase.synk://login-callback">Reset Password in App</a>
        <p id="hint" class="hint" hidden>
          Nothing happened? Open this email on the phone where Synk is installed.
        </p>
      </section>
    </main>
    <script src="blobs.js"></script>
    <script src="app.js"></script>
    <script>
      synkRedirect({ host: "reset-password", requireToken: true, includeType: false });
    </script>
  </body>
</html>
