<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset Password · Synk</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orbs" aria-hidden="true">
      <div class="orb teal"></div>
      <div class="orb sand"></div>
      <div class="orb peach"></div>
    </div>

    <header class="brand"><img src="logo.png" alt="" />Synk</header>

    <main class="content">
      <div id="badge" class="badge" hidden aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
      </div>
      <h1 id="title">Reset your password</h1>
      <p id="message" class="subtitle">Opening Synk…</p>
      <form id="reset-form" class="reset-form" hidden novalidate>
        <input id="new-password" class="field" type="password" placeholder="New password" autocomplete="new-password" aria-label="New password" />
        <input id="confirm-password" class="field" type="password" placeholder="Confirm new password" autocomplete="new-password" aria-label="Confirm new password" />
        <p class="hint">At least 8 characters, with an uppercase letter, a lowercase letter, a number and a special character.</p>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button id="save-password" class="button" type="submit">Update password</button>
      </form>
      <p id="app-note" class="note" hidden>Have Synk on this phone?</p>
      <a id="open-app" class="button" href="io.supabase.synk://login-callback"><img class="button-logo" src="logo.png" alt="" /><span>Continue to Synk</span></a>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
      synkRedirect({ host: "reset-password", requireToken: true, includeType: false, passwordForm: true });
    </script>
  </body>
</html>
